name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mentis
          POSTGRES_PASSWORD: mentis
          POSTGRES_DB: mentis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentis -d mentis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://mentis:mentis@localhost:5432/mentis_test
      AUTH_JWT_SECRET: test-secret-for-ci-only-mentis-32chars
      DEV_USER_ID: 00000000-0000-4000-8000-000000000001
      DEV_SUBJECT_ID: 00000000-0000-4000-8000-000000000002

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      AUTH_JWT_SECRET: test-secret-for-ci-only-mentis-32chars
      AUTH_DEV_FALLBACK: "false"
      DEV_USER_ID: 00000000-0000-4000-8000-000000000001
      DEV_SUBJECT_ID: 00000000-0000-4000-8000-000000000002
      NEXT_PUBLIC_DEV_SUBJECT_ID: 00000000-0000-4000-8000-000000000002
      DATABASE_URL: postgresql://mentis:mentis@localhost:5432/mentis_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mentis
          POSTGRES_PASSWORD: mentis
          POSTGRES_DB: mentis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentis -d mentis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
